<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>janet-lab 閱讀器</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="reader.css">
</head>
<body class="rd">
<header class="rd-bar">
  <button id="rd-menu" class="rd-icon" type="button" aria-label="開關目錄">☰</button>
  <a class="rd-brand" href="../home.html" title="回首頁">janet-lab</a>
  <input id="rd-q" type="search" placeholder="全文搜尋（空白分隔多個詞，Esc 清掉）" autocomplete="off" spellcheck="false">
  <button id="rd-theme" class="rd-icon" type="button" title="切換亮／暗">◑</button>
</header>
<div class="rd-layout">
  <aside id="rd-side"><p class="rd-home"><a href="../home.html">⌂ 首頁（全部入口）</a> · <a href="../index.html">速查表</a></p><nav id="rd-tree" aria-label="目錄"></nav></aside>
  <div id="rd-scrim"></div>
  <main id="rd-main">
    <section id="rd-results" hidden></section>
    <div id="rd-crumb" class="rd-crumb"></div>
    <details id="rd-toc-inline" class="rd-toc-inline"><summary>本頁目錄</summary><div></div></details>
    <article id="rd-doc"></article>
    <nav id="rd-pager" class="rd-pager"></nav>
  </main>
  <aside id="rd-toc" class="rd-toc"></aside>
</div>
<noscript><p class="rd-crumb">這個閱讀器需要 JavaScript；沒有的話直接看 repo 裡的 .md 檔。</p></noscript>
<script src="vendor/marked.min.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
